name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/runtime
      - name: Run runtime tests
        run: cargo test --manifest-path native/runtime/Cargo.toml

  proot:
    uses: ./.github/workflows/proot.yml

  # Runs even if the PRoot job fails, so the Kotlin/Rust build is always exercised, but an
  # APK is only uploaded if PRoot and the Rust library are inside it for every CPU type.
  build:
    needs: proot
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/runtime
      - name: Cache cargo-ndk
        id: ndkcache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v1
      - name: Install cargo-ndk
        if: steps.ndkcache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: proot-android
          path: app/src/main/jniLibs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and debug APK (compiles the Rust library for all four CPU types)
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Report native library alignment (16 KB pages)
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            f="app/src/main/jniLibs/$abi/liblinuxboot_runtime.so"
            echo "== $abi: LOAD segment alignment: $(readelf -lW "$f" | awk '/LOAD/ {print $NF}' | sort -u | tr '\n' ' ')"
          done
      - name: Require PRoot and the Rust library inside the APK for every CPU type
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            n=$(unzip -l "$apk" | grep -cE "lib/$abi/(libproot|libproot-loader|liblinuxboot_runtime)\.so")
            echo "$abi: $n of 3 native libraries"
            if [ "$n" -ne 3 ]; then
              echo "::error::$abi is missing native libraries ($n of 3). Refusing to publish."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linuxboot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
