name: Release alpha

# Publishes a signed alpha as a GitHub pre-release: one APK per CPU type plus a universal APK.
# Run it from the Actions tab (Run workflow), or push a tag such as v0.2.0-alpha.1.
# Signing uses the ALPHA_KEYSTORE_B64, ALPHA_KEYSTORE_PASSWORD and ALPHA_KEY_ALIAS repository secrets,
# so every alpha has the same signature and installs over the previous one as an update.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Extra text for the release notes
        required: false
        default: ""
  push:
    tags:
      - "v*-alpha*"

permissions:
  contents: write

concurrency:
  group: release-alpha
  cancel-in-progress: false

jobs:
  proot:
    uses: ./.github/workflows/proot.yml

  release:
    needs: proot
    runs-on: ubuntu-latest
    env:
      ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
      ALPHA_KEY_ALIAS: ${{ secrets.ALPHA_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/runtime
      - name: Cache cargo-ndk
        id: ndkcache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v1
      - name: Install cargo-ndk
        if: steps.ndkcache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked
      - uses: actions/download-artifact@v4
        with:
          name: proot-android
          path: app/src/main/jniLibs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Work out the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v0.1.0-alpha.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Prepare the signing key
        env:
          KS_B64: ${{ secrets.ALPHA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ALPHA_KEYSTORE_B64 is not set. Refusing to publish an alpha signed with a throwaway key."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/alpha.p12"
          echo "ALPHA_KEYSTORE_FILE=$RUNNER_TEMP/alpha.p12" >> "$GITHUB_ENV"

      - name: Test
        run: |
          cargo test --manifest-path native/runtime/Cargo.toml
          gradle testDebugUnitTest -PrustAbis=arm64-v8a --no-daemon

      - name: Build release APKs (one per CPU type, plus universal)
        run: >
          gradle assembleRelease -PsplitAbi
          -PversionName=${{ steps.ver.outputs.name }}
          -PversionCode=${{ steps.ver.outputs.code }}
          --no-daemon

      - name: Verify signatures and native libraries, collect files
        env:
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            base=$(basename "$apk" -release.apk)
            abi=${base#app-}
            echo "== $apk ($abi)"
            "$bt/apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
            if [ "$abi" = universal ]; then abis="arm64-v8a armeabi-v7a x86_64 x86"; else abis="$abi"; fi
            for a in $abis; do
              n=$(unzip -l "$apk" | grep -cE "lib/$a/(libproot|libproot-loader|liblinuxboot_runtime)\.so")
              if [ "$n" -ne 3 ]; then
                echo "::error::$apk is missing native libraries for $a (found $n of 3). Refusing to publish."
                exit 1
              fi
            done
            cp "$apk" "dist/LinuxBoot-${VERSION}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Keep the R8 mapping for reading crash reports
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ steps.ver.outputs.name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publish the pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: LinuxBoot ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            **Alpha build. Expect bugs, and expect things to change.** It has not been tested on every device.

            Install the file that matches your phone's processor:

            | File | For |
            | --- | --- |
            | `*-arm64-v8a.apk` | Almost every phone made since 2017 (64-bit ARM) |
            | `*-armeabi-v7a.apk` | Older or low-end phones (32-bit ARM) |
            | `*-x86_64.apk` | Intel/AMD devices, Chromebooks, emulators (64-bit x86) |
            | `*-x86.apk` | 32-bit x86 devices and emulators |
            | `*-universal.apk` | Works on all of the above; about four times larger |

            Linux distributions are downloaded inside the app and must match your processor, so some are not
            available on every CPU type. Verify a download against `SHA256SUMS.txt`.

            ${{ inputs.notes }}
