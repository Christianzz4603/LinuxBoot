[package]
name = "linuxboot_runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
