[package]
name = "linuxboot_runtime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
flate2 = "1"
jni = "0.21"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Speed first: this code hashes, decompresses and unpacks hundreds of megabytes on a phone.
opt-level = 3
# Whole-program optimisation across the crate and its C dependency boundary, one codegen unit.
lto = "fat"
codegen-units = 1
# Keep unwinding: the JNI entry points catch panics and report them as errors. With abort, any
# bug would take the whole app down instead.
panic = "unwind"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
